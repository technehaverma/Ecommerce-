spring:
   application:
      name: order-service
   jpa:
      show-sql: true
      properties:
         hibernate:
            jdbc:
               time_zone: Asia/Kolkata
      hibernate:
         ddl-auto: update
      database-platform : org.hibernate.dialect.PostgreSQLDialect 
   datasource:
      url: jdbc:postgresql://localhost:5432/orderdb?options=-c%20timezone=Asia/Kolkata
      username: root
      password: root
   config:
      import:
         configserver:http://localhost:8888   
   rabbitmq:
      host: localhost 
      port: 5672
      username: guest
      password: guest
management:
   endpoints:
      web:
         exposure: 
            include: "*"
eureka:
   client:
      register-with-eureka: false
      fetch-registry: false
      service-url:
         defaultZone: http://localhost:8761/eureka/
#   h2:
#      console:
#         enabled: true
#   datasource:
#      url: jdbc:h2:mem:test
server:
   port: 8081
